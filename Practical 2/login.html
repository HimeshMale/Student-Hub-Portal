<!doctype html>
<html>

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="../CSS/login.css" />
  <title>Login</title>
</head>

<body>

  <div class="Login">
    <header>
      <h1>Login</h1>
    </header>
    <main>
      <form action="home.html" id="form">
        <label for="usrname">Username:</label>
        <input type="text" name="usrname" id="usr" required>
        <span class="error-msg" id="usrError"></span>
        <label for="passwd">Password:</label>
        <input type="password" name="passwd" id="passwd" required>
        <span class="error-msg" id="passwdError"></span>
        <p>&nbsp;</p>
        <input type="submit" value="Login" id="login">
        <a href="Register.html">New User?</a>
    </main>
  </div>
  </form>
  <script src="../JS/login.js"></script>
</body>

</html>
