<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../CSS/register.css" />
    <title>Register</title>
  </head>
  <body>
    <header>
      <h1 align="center">Register</h1>
    </header>
    <form action="login.html" id="form">
      <main>
        <label for="usrname">Username:</label>
        <input type="text" name="usrname" id="usrname" required />
        <span class="error-msg" id="usrError"></span>

        <label for="passwd">Password:</label>
        <input type="password" name="passwd" id="passwd" required />
        <span class="error-msg" id="passwdError"></span>
        

        <label for="confirmpasswd">Confirm Password:</label>
        <input
          type="password"
          name="confirmpasswd"
          id="confirmpasswd"
          required
        />
        <span class="error-msg" id="confirmPasswdError"></span>

        <p>&nbsp;</p>

        <input type="submit" id="register" value="Register" />

        <a href="login.html">Already a User?</a>
      </main>
    </form>
    <script src="../JS/register.js"></script>
  </body>
</html>
