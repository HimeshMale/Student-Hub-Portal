<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../CSS/register.css" />
    <title>Register</title>
  </head>
  <body>
    
    <header>
      <h1 align="center">Register</h1>
    </header>
    <main>
      <label for="usrname">Username:</label>
      <input type="text" name="usrname" id="usrname" required /><br /><br />

      <label for="passwd">Password:</label>
      <input type="password" name="passwd" id="passwd" required /><br /><br />

      <label for="confirmpasswd">Confirm Password:</label>
      <input type="password" name="confirmpasswd" id="confirmpasswd" required />

      <p>&nbsp;</p>

      <button id="registerBtn">Register</button>

      <a href="login.html">Already a User?</a>
    </main>

    <script src="../JS/register.js"></script>
  </body>
</html>
