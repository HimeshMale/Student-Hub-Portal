<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="../CSS/login.css" />
    <title>Login</title>
  </head>
  <body>

    <div class="Login">
      <header>
        <h1>Login</h1>
      </header>
      <main>
        <form id="form">
          <label for="usr">Username:</label>
          <input type="text" name="usr" id="usr" required />
          <span id="usrError" class="error-msg"></span>
          

          <label for="passwd">Password:</label>
          <input type="password" name="passwd" id="passwd" required />
          <span id="passwdError" class="error-msg"></span>
          <p>&nbsp;</p>

          <button type="submit" id="home">Login</button>
        </form>

        <a href="Register.html">New User?</a>
      </main>
    </div>

    <script src="../JS/login.js"></script>
  </body>
</html>
